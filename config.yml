# ===========================================================================
# TAGS SYSTEM
# ===========================================================================
# The Tags System is a powerful and user-friendly
# way to share pre-written responses for common questions and issues.
# 
# How it works:
# - Staff can use /tag <name> to send a tag (shows all tags in dropdown)
# - Each tag can be formatted as text or embed
# - Tags can include variables that automatically insert contextual information
#
# Use cases:
# - Frequently asked questions
# - Troubleshooting steps for common issues
# - Links to resources and documentation
# - Standard responses and policies
#
# You can use these variables in your tag content:
#
# Ticket-specific variables (only work in tickets):
# {ticket} - Ticket channel mention (e.g., #ticket-username)
# {ticket_name} - Ticket channel name without mention
# {ticket_id} - Ticket's unique identifier
# {ticket_author} - Mention of the user who created the ticket
# {ticket_category} - Type of ticket (e.g., "General Support")
# {ticket_created} - When the ticket was created
#
# Examples:
# "Your ticket ({ticket_id}) was created on {ticket_created}."

Tags:
  Enabled: false  # Set to false to disable the tags system
  
  TagsList:
    faq: 
      Title: "FAQ Link"
      Content: "You can find answers to frequently asked questions on our FAQ page: https://example.com/faq\n\nIf your question isn't answered there, please let us know!"
      Type: "text"
      RestrictToSupportRoles: false
      OnlyInTickets: false
    
    connection:
      Title: "Connection Issues"
      Content: "**Connection Troubleshooting:**\n\n1. Check your internet connection\n2. Restart the application\n3. Clear the app cache (Settings → Advanced → Clear Cache)\n4. Make sure your firewall isn't blocking the connection\n\nIf you're still having issues, please let us know what steps you've tried and any error messages you're seeing."
      Type: "embed"
      RestrictToSupportRoles: true
      OnlyInTickets: true 
      Color: "#ff5555"
    
    password:
      Title: "Password Reset"
      Content: "**How to Reset Your Password:**\n\n1. Go to https://example.com/login\n2. Click 'Forgot Password'\n3. Enter your email address\n4. Check your email and follow the link\n5. Create your new password"
      Type: "embed"
      RestrictToSupportRoles: true
      OnlyInTickets: false

    # You can add up to 25 tags!


# ===========================================================================
# AI INTEGRATION
# ===========================================================================
AI:
  Enabled: false
  OpenAIAPIKey: "API_KEY" # Get from https://platform.openai.com/api-keys
  Model: "gpt-3.5-turbo"

  # AI-powered ticket close summaries, automatically generates a summary when tickets are closed
  TicketCloseSummaries:
    Enabled: false # Enable AI-generated summaries when tickets are closed?
    MaxMessagesToAnalyze: 50 # Maximum number of recent messages to include in summary analysis (higher = more context but higher API costs)
    SummaryLength: "short" # Length of summary: "short" (1-2 sentences), "medium" (3-4 sentences), "long" (paragraph)
    IncludeInLogs: true # Include the AI summary in ticket close logs?
    Language: "English"
    DefaultMessage: "Summary could not be generated" # Message to show when summary generation fails (leave blank to hide)

# ===========================================================================
# AI AUTO RESPONSE SYSTEM
# ===========================================================================
# This system uses OpenAI to intelligently detect user questions and provide
# contextually appropriate responses. The AI analyzes the intent and content
# of messages to determine the best response, making it much more reliable
# than simple string matching.

# Documentation: https://docs.plexdevelopment.net/plex-tickets/ai-autoresponse

# ANALYTICS & STATISTICS
# Use the /ai-analytics command in Discord to view detailed statistics and analytics
# about this AI auto response system, including:
# - Overall response statistics and performance metrics
# - Individual response type usage and accuracy rates
# - User feedback and satisfaction scores
# - Monthly reports and trends

AIAutoResponse:
  Enabled: false
  ConfidenceThreshold: 0.7 # AI confidence threshold (0.0 to 1.0) to trigger response

  Statistics:
    Enabled: true # Track response statistics?
    LogsChannelID: "CHANNEL_ID" # Channel to log AI response statistics
  
  ChannelFilter:
    Mode: "DISABLED" # Can be "WHITELIST", "BLACKLIST", or "DISABLED"
    Channels: [] # Channel IDs - if whitelist: only these channels, if blacklist: exclude these channels
    Categories: [] # Category IDs - if whitelist: only these categories, if blacklist: exclude these categories
    # Example:
    # Channels: ["123456789012345678", "987654321098765432"]
    # Categories: ["111222333444555666", "777888999000111222"]

  Responses:
    server_connection:
      # AI will match questions about: server IP, how to connect, server address, joining server, etc.
      Triggers: ["server IP", "how to connect", "server address", "join server", "connection", "minecraft server"]
      Message: "Our server IP is **play.example.com**. You can connect using any Minecraft client!"
      Type: "EMBED" # Can be "EMBED" or "TEXT"
      Color: "#00FF00" # Hex color for embed (only used if Type is EMBED)
      OnlyInTickets: false # Only enable this response in tickets?
      
    password_reset:
      # AI will match questions about: password reset, forgot password, can't login, account recovery, etc.
      Triggers: ["password reset", "forgot password", "can't login", "account recovery", "reset my password"]
      Message: "To reset your password, visit our recovery page: https://example.com/reset-password and follow the instructions."
      Type: "TEXT"
      OnlyInTickets: false # Only enable this response in tickets?
      
    support_help:
      # AI will match questions about: getting help, support, assistance, ticket creation, etc.
      Triggers: ["need help", "support", "assistance", "create ticket", "get help", "contact staff"]
      Message: "Need help? Create a support ticket or visit our help center: https://example.com/support"
      Type: "EMBED"
      Color: "#5865F2"
      OnlyInTickets: false # Only enable this response in tickets?
      
    billing_payment:
      # AI will match questions about: billing, payments, invoices, refunds, subscription, etc.
      Triggers: ["billing", "payment", "invoice", "refund", "subscription", "charge", "money"]
      Message: "For billing inquiries, please create a ticket and select the Billing category. Our team will assist you promptly!"
      Type: "EMBED"
      Color: "#FFA500"
      OnlyInTickets: false # Only enable this response in tickets?
      
    account_ban:
      # AI will match questions about: bans, appeals, why banned, account suspended, etc.
      Triggers: ["banned", "ban appeal", "why banned", "account suspended", "appeal", "unban"]
      Message: "If you believe your ban was issued in error, please submit an appeal at: https://example.com/appeal"
      Type: "EMBED" 
      Color: "#FF0000"
      OnlyInTickets: false # Only enable this response in tickets?
      
  ButtonSettings:
    Enabled: true # Show feedback buttons on AI responses?
    HelpfulButton: "👍 This helped!" # Button text for positive feedback
    NotHelpfulButton: "👎 Still need help" # Button text for negative feedback
    RestrictToOriginalUser: true # Only allow the original user to click buttons?
    
  Embed:
    Title: "🤖 AI Assistant" # Title for AI response embeds, Leave blank to disable
    Color: "#5865F2" # Default embed color, can be overridden per response
    ThumbnailURL: "" # URL for embed thumbnail, leave blank to disable
    
    Footer:
      Text: "Powered by AI" # Footer text, Leave blank to disable
      ShowUserAvatar: true # Show the message author's avatar in footer
      ShowTimestamp: true # Show timestamp in footer

