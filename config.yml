# TICKET REVIEW SYSTEM AND USER CLOSE DM
# ===========================================================================
TicketUserCloseDM:
  Enabled: true # Send a message to the user that created the ticket when it gets closed?
  SendTranscript: true # Send ticket transcript with the message?
  TicketInformation: true # Add ticket information to the embed?
  ShowCloseReason: true # Show close reason in the ticket details?
  ShowClosedBy: true # Show who closed the ticket in the ticket details?
  ShowParticipants: true # Show detailed list of all participants?
