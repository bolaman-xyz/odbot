TicketReviewSettings:
  Enabled: true # Enable ticket review system?
  AskWhyModal: false # Ask users to explain why they are giving their review?
  ReviewPrompt: "> We value your feedback and would appreciate your rating of our support.\n> Please take a moment to share your satisfaction level by choosing a rating between **1-5** stars below." # The message asking for a review
  ticketRated: "> You rated this ticket: {star} ({rating}/5)"
  ticketReviewed: "> You rated this ticket: {star} ({rating}/5)\n> Your Review: {reviewMessage}"
  ReviewMsg: "Thank you for leaving a review!"
  MinimumWords: 20
  MaximumWords: 250

TicketReviewRequirements:
  Enabled: false # Enable requirements to review a ticket to prevent abuse/spam?
  TotalMessages: 5 # The amount of messages that has to be in the ticket for the user to be able to review it

# If this is enabled and AskWhyModal is enabled, All reviews will also be sent to a separate channel with more details about the review, Useful if you want to show your reviews to everyone in the server
ReviewChannel: 
  Enabled: false
  ChannelID: "CHANNEL_ID" # The channel to send reviews to
  Embed:
    Title: "New Ticket Review" # Leave blank to disable, Valid variables: {totalReviews}, {ticketCreator.username}, {ticketCategory}, {ticket.totalMessages}
    Color: "#FF5D5D"  # Matching your modern red color
    ThumbnailEnabled: true
    CustomThumbnail: ""  # Leave blank to use user's profile picture, or use a custom image URL
    Fields: # Valid variables: {ticketCreator.id}, {ticketCreator.username}, {ticketCategory}, {ticket.totalMessages}, {stars}, {reviewMessage}
      - name: "`👤` **User Information**"
        value: "> **Creator:** <@!{ticketCreator.id}> `{ticketCreator.username}`\n> **Category:** `{ticketCategory}`\n> **Messages:** `{ticket.totalMessages}`"
      - name: "`⭐` **User Feedback**"
        value: "> {stars} `({rating}/5)`\n> {reviewMessage}"
    Timestamp: true
    Footer:
      Enabled: true
      IconEnabled: true
      CustomIconURL: ""  # Leave blank to use user's profile picture
      text: "Review #{totalReviews}" # Added the review number to the footer

